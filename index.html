<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Strict CSP: no inline scripts, no inline styles, nothing loaded from
  anywhere except this site and the Apps Script backend. See
  docs/00-what-we-built-security.md for why this matters — the old app had
  none of this.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>Task Planner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">

  <!-- Shown when no device key is saved on this device yet. -->
  <section id="key-screen" class="screen key-screen" hidden>
    <div class="key-card">
      <h1 class="key-title">Task Planner</h1>
      <p class="key-copy">Paste your device key to connect this browser to your tasks.</p>
      <label class="field">
        <span class="field-label">Device key</span>
        <input id="device-key-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <button type="button" id="save-key-btn" class="btn btn-primary">Save</button>
      <p id="key-screen-message" class="key-message" aria-live="polite"></p>
    </div>
  </section>

  <!-- The real app. Hidden until a device key exists (or ?mock=1 is set). -->
  <div id="main-screen" class="app-shell" hidden>

    <header class="topbar">
      <div class="brand">Task Planner</div>
      <nav class="tabs" aria-label="Sections">
        <button type="button" class="tab-btn" data-tab="today" aria-current="page">Today</button>
        <button type="button" class="tab-btn" data-tab="week">Week</button>
        <button type="button" class="tab-btn" data-tab="someday">Someday</button>
      </nav>
      <div class="topbar-right">
        <span id="sync-dot" class="sync-dot sync-dot-idle" aria-hidden="true"></span>
        <button type="button" id="gear-btn" class="icon-btn" aria-label="Settings">&#9881;</button>
      </div>
    </header>

    <main class="panels">

      <section id="panel-today" class="panel" data-panel="today">
        <p id="migration-notice" class="notice" hidden>
          Your tasks need a one-time upgrade before they can show up here.
          See <code>docs/RUNBOOK.md</code>, section G, for the steps &mdash;
          nothing has been lost.
        </p>

        <form id="capture-form" class="capture">
          <textarea id="capture-input" class="capture-input" placeholder="What's on your mind?" rows="1" aria-label="Capture a task"></textarea>
          <div class="capture-row">
            <label class="chip-toggle">
              <input type="checkbox" id="today-toggle" checked>
              <span>Today</span>
            </label>
            <button type="submit" id="capture-submit" class="btn btn-primary">Add</button>
          </div>
        </form>

        <div id="pick-three-card" class="card pick-three" hidden></div>

        <ul id="today-list" class="task-list" aria-label="Today's tasks"></ul>
        <button type="button" id="done-today-toggle" class="done-today-toggle" hidden aria-expanded="false"></button>
        <ul id="done-today-list" class="task-list done-list" hidden aria-label="Done today"></ul>
      </section>

      <section id="panel-week" class="panel" data-panel="week" hidden>
        <div id="week-strip" class="week-strip"></div>
        <details id="unscheduled-drawer" class="drawer">
          <summary>Not scheduled yet</summary>
          <input type="text" id="unscheduled-filter" class="filter-input" placeholder="Filter by title, notes or category">
          <div id="unscheduled-groups"></div>
        </details>
      </section>

      <section id="panel-someday" class="panel" data-panel="someday" hidden>
        <p class="hint">Nothing here is ever deleted.</p>
        <ul id="someday-list" class="task-list" aria-label="Someday tasks"></ul>
      </section>

    </main>

    <nav class="bottom-nav" aria-label="Sections">
      <button type="button" class="tab-btn" data-tab="today" aria-current="page">Today</button>
      <button type="button" class="tab-btn" data-tab="week">Week</button>
      <button type="button" class="tab-btn" data-tab="someday">Someday</button>
      <button type="button" id="gear-btn-mobile" class="icon-btn" aria-label="Settings">&#9881;</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<dialog id="action-sheet" class="sheet"></dialog>
<dialog id="edit-sheet" class="sheet"></dialog>
<dialog id="settings-sheet" class="sheet"></dialog>

<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
